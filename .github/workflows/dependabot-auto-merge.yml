name: Dependabot auto-merge

# Merges the dependency pull requests Dependabot opens, once the same checks a
# human push gets have passed. Written out by hand rather than using
# `gh pr merge --auto`, because that only waits for *required* status checks and
# master has no branch protection: without required checks it would merge
# immediately, before CI had even started.
#
# A semver-major bump is never merged here. That is the one update a person
# should read, and it is why this exists in this shape.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number to act on'
        required: true
        type: string

permissions:
  # Merging writes a commit, so contents:write is not optional: with only
  # pull-requests:write the merge fails with "Resource not accessible by
  # integration (mergePullRequest)".
  contents: write
  pull-requests: write

# Keyed to the pull request, so an `opened` and a `synchronize` cannot both
# try to merge the same thing.
concurrency:
  group: dependabot-merge-${{ inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    # Dependabot's own token cannot trigger workflows, so `pull_request` would
    # never fire for its pull requests. `pull_request_target` is the documented
    # way to act on them. Nothing here checks out the pull request's code, so
    # the write permission never touches untrusted files.
    #
    # `workflow_dispatch` is for proving the thing works: Dependabot only
    # re-fires this on `synchronize`, so a PR that has already been seen cannot
    # be re-tested any other way.
    if: github.event_name == 'workflow_dispatch' || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ inputs.pr || github.event.pull_request.number }}
        run: |
          set -uo pipefail
          url=$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json url,headRefOid,author \
            --jq '"\(.url) \(.headRefOid) \(.author.login)"') || exit 1
          echo "url=$(cut -d' ' -f1 <<<"$url")" >> "$GITHUB_OUTPUT"
          echo "head=$(cut -d' ' -f2 <<<"$url")" >> "$GITHUB_OUTPUT"
          echo "author=$(cut -d' ' -f3 <<<"$url")" >> "$GITHUB_OUTPUT"

      - name: Refuse anything but a Dependabot pull request
        if: github.event_name != 'workflow_dispatch' && steps.pr.outputs.author != 'dependabot[bot]'
        run: echo "not a Dependabot pull request" >&2 && exit 1

      # This action reads the Dependabot PR from the pull_request_target event,
      # and refuses to run without one ("PR is not from Dependabot"). A manual
      # dispatch has no such event, so it is the one path that skips it: a person
      # asked for this run by number, which is the override the major-bump guard
      # exists to protect.
      - name: Read the update metadata
        id: meta
        if: github.event_name != 'workflow_dispatch'
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Leave a major bump for review
        if: github.event_name != 'workflow_dispatch' && steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url }}
          PACKAGE: ${{ steps.meta.outputs.dependency-name }}
        run: |
          gh pr comment "$PR_URL" --body \
            'Left for review on purpose: this is a major bump. `npm ci` fails only
            if a peer range forbids it, which says nothing about whether the
            release notes describe a change you want. Read them, then merge.'

          # The tracking issue says it closes itself. A pull request body would
          # have to say "Closes #7" for GitHub to close it, and Dependabot does
          # not know the number, so the label is the link instead: when the
          # major this issue watches for actually arrives, close it here.
          if [ "$PACKAGE" = "eslint" ]; then
            gh issue list --repo "$GITHUB_REPOSITORY" --label eslint-major \
              --state open --json number \
              --jq '.[].number' | while read -r number; do
                [ -n "$number" ] || continue
                gh issue close "$number" \
                  --comment "The major bump this was tracking is open as $PR_URL."
              done
          fi

      - name: Wait for verify and e2e
        id: checks
        if: github.event_name == 'workflow_dispatch' || steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD: ${{ steps.pr.outputs.head }}
        run: |
          set -uo pipefail
          # The jobs deploy.yml runs, minus `deploy`: there is nothing to publish
          # for someone else's dependency bump. No `set -e`, and every network
          # call ends in `|| true`, so a gh hiccup reads as "not yet" rather than
          # abandoning the run.
          #
          # Every line written to $GITHUB_OUTPUT is name=value. A colon is not a
          # delimiter and the runner rejects the file outright, which fails the
          # step after the decision was already made.
          wanted=(verify e2e)
          for attempt in $(seq 1 40); do
            values=()
            for job in "${wanted[@]}"; do
              conclusion=$(gh api \
                "repos/$GITHUB_REPOSITORY/commits/$HEAD/check-runs" \
                --jq "[.check_runs[] | select(.name == \"$job\")] | first | (.conclusion // \"pending\")" \
                2>/dev/null || true)
              # gh prints an error body on stdout as well as failing, so an
              # unknown string here means the check has not reported, not that it
              # failed. Anything unrecognised keeps polling and ends in the
              # timeout message, which is honest; the alternative is reporting a
              # failure that never happened.
              case "$conclusion" in
                success | failure | cancelled | timed_out | action_required | neutral | skipped | stale) ;;
                *) conclusion=pending ;;
              esac
              values+=("$conclusion")
            done

            echo "attempt $attempt:$(printf ' %s' "${values[@]}")"
            case " ${values[*]} " in
              *pending*)
                sleep 30
                continue
                ;;
              *success*)
                echo "converged=success" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              *)
                echo "a check did not pass; leaving the pull request open"
                echo "converged=other" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done
          echo "checks did not converge within 20 minutes; leaving the pull request open"
          echo "converged=timeout" >> "$GITHUB_OUTPUT"

      - name: Squash-merge
        if: steps.checks.outputs.converged == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.url }}
        run: |
          set -uo pipefail
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash
          # `--delete-branch` needs a git checkout and there is none, so the
          # branch goes through the API instead. Best effort: the merge is the
          # part that matters, and a failure here must not look like one.
          branch=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
            --json headRefName --jq '.headRefName')
          if [ -n "$branch" ] && [ "$branch" != "master" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" \
              || echo "could not delete $branch, the merge stands"
          fi

      - name: Explain a failure
        if: steps.checks.outputs.converged == 'other'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.url }}
        run: |
          gh pr comment "$PR" --body \
            'CI did not pass, so this was left open on purpose. Fix the branch or
            run `npm run verify && npm run e2e` locally to see it.'

      - name: Explain a timeout
        if: steps.checks.outputs.converged == 'timeout'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.url }}
        run: |
          gh pr comment "$PR" --body \
            'The checks did not finish within 20 minutes, so this was left open on
            purpose. Re-run this workflow, or merge if the run is already green.'
