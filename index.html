  try {
    var __t = window.localStorage.getItem('rust-mastery-theme');
    if (__t !== 'dark' && __t !== 'light') {
      __t = (typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.dataset.theme = __t;
  } catch (_) {}
